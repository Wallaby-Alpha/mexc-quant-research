# Research Configuration for MEXC Swing-High Retest

project:
  name: "mexc_swing_high_retest"
  version: "1.0.0"

market:
  venue: "futures" # "futures" (USDT-M Perpetual) or "spot"
  quote_currency: "USDT"

data:
  cache_dir: "data_cache"
  reports_dir: "reports"
  results_dir: "results"
  timeframes:
    - "15m"
    - "1h"
  history_days: 360
  start_date: "2025-10-04T00:00:00Z"
  end_date: "2026-09-29T00:00:00Z"
  holdout_start: "2026-07-01T00:00:00Z"
  request_rate_limit: 10 # Requests per second
  max_retries: 3
  backoff_seconds: 1.0
  timeout_seconds: 15.0

universe:
  target_size: 200
  sample_size_smoke: 20
  min_volume_usdt: 1000000.0
  min_history_1h_bars: 250
  always_include:
    - "BTC_USDT"
    - "ETH_USDT"
  excluded_symbols:
    - "USDC_USDT"
    - "FDUSD_USDT"
    - "TUSD_USDT"
    - "BUSD_USDT"
    - "DAI_USDT"
    - "EUR_USDT"
    - "XAU_USDT"
    - "SILVER_USDT"
    - "MUSTOCK_USDT"
    - "SITMSTOCK_USDT"
    - "KOSPI_USDT"
    - "NVD_USDT"

execution_defaults:
  maker_fee_rate: 0.0000
  taker_fee_rate: 0.0002
  base_slippage_bps: 5.0
  funding_rate_8h: 0.0001
  slippage_by_rank:
    "1-25": 5.0
    "26-50": 7.5
    "51-100": 10.0
    "101-200": 15.0
    "201-300": 20.0
    "default": 25.0

